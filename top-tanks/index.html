<style>
  :root {
    /* Палитра под баннер: глубокий красный + неон пурпур + циан */
    --gold: #e12d3c;
    --gold-light: #ff5a68;
    --gold-dark: #9e1e2a;
    --accent-neon: #d946ef;
    --accent-cyan: #22d3ee;
    --red: #b91c1c;
    --dark: #0a0910;
    --dark2: #12101a;
    --dark3: #1a1624;
    --dark4: #252030;
    --text: #eceaf0;
    --text-muted: #9390a8;
    --border: rgba(225, 45, 60, 0.28);
    --border-subtle: rgba(255,255,255,0.06);
    --container: 1400px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  section { scroll-margin-top: 84px; }
  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }
  .skip-link {
    position: absolute;
    left: 12px; top: 12px;
    padding: 10px 14px;
    background: rgba(10,11,13,0.95);
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-family: 'Oswald', sans-serif;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transform: translateY(-200%);
    transition: transform .2s ease;
    z-index: 10001;
  }
  .skip-link:focus { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
  /* noise убран для повышения FPS */
  .scroll-progress {
    position: fixed; top: 0; left: 0;
    height: 2px; width: 0;
    background: linear-gradient(90deg, var(--gold), var(--accent-neon));
    z-index: 10000;
    transition: width .08s linear;
  }
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 1000;
    /* светлее, как шапка модпака: графитовый фон + красное свечение слева за логотипом */
    background:
      radial-gradient(ellipse 420px 140% at 0% 50%, rgba(225,45,60,0.22), rgba(225,45,60,0) 70%),
      linear-gradient(180deg, #1d2029 0%, #171920 100%);
    /* backdrop-filter убран для повышения FPS */
    border-bottom: 1px solid var(--border);
    padding: 0 40px; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
    transition: box-shadow .25s ease, background .25s ease;
  }
  nav.nav-scrolled {
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .nav-logo {
    font-family: 'Montserrat', sans-serif; /* як «Модпак» в установнику */
    font-size: 21px; font-weight: 800;
    letter-spacing: 0.5px; color: var(--gold);
    text-decoration: none;
    display: flex; align-items: center; gap: 10px;
  }
  .nav-logo span { color: #fff; }
  .nav-logo-img {
    height: 36px;
    width: auto;
    max-width: min(160px, 38vw);
    object-fit: contain;
    object-position: left center;
    display: block;
    flex-shrink: 0;
  }
  .nav-right { display: flex; align-items: center; gap: 32px; }
  .lang-switcher {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px;
    background: #17151f;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
  }
  .lang-btn {
    display: inline-flex; align-items: center; gap: 10px;
    background: transparent; border: 0;
    color: var(--text-muted);
    padding: 9px 18px; border-radius: 999px;
    font-family: 'Montserrat', sans-serif; font-weight: 800;
    font-size: 15px; line-height: 1; letter-spacing: 0.3px;
    text-transform: uppercase;
    cursor: pointer; transition: background .2s, color .2s, box-shadow .2s;
  }
  .lang-btn:hover { color: var(--text); }
  .lang-btn.active {
    background: linear-gradient(180deg, #e65c66 0%, #c9434e 100%); color: #fff;
    box-shadow: 0 2px 10px rgba(201,67,78,0.3);
  }
  .lang-flag { width: 26px; height: 17px; border-radius: 3px; display: block; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(0,0,0,0.25); }
  .nav-tg {
    display: flex; align-items: center; gap: 9px;
    /* м'якший червоний замість різкого + білий текст */
    background: linear-gradient(180deg, #e65c66 0%, #c9434e 100%); color: #fff;
    text-decoration: none; padding: 9px 22px;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px; font-weight: 800;
    letter-spacing: 0.6px; text-transform: uppercase;
    transition: all 0.2s;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
  }
  .nav-tg:hover {
    background: linear-gradient(180deg, #ee6d76 0%, #d44f5a 100%);
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(225,45,60,0.25);
  }
  .nav-tg-icon { width: 18px; height: 18px; display: block; flex-shrink: 0; }
  /* навігація по центру шапки */
  .nav-center {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: 6px;
  }
  .nav-link {
    position: relative;
    font-family: 'Montserrat', sans-serif; font-weight: 800;
    font-size: 14px; letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--text-muted); text-decoration: none;
    padding: 10px 18px; border-radius: 999px;
    transition: color .2s, background .2s;
  }
  .nav-link:hover { color: #fff; background: rgba(255,255,255,0.05); }
  .nav-link.active { color: #fff; }
  .nav-link.active::after {
    content: ''; position: absolute; left: 18px; right: 18px; bottom: 3px; height: 2px;
    border-radius: 2px; background: linear-gradient(90deg, #e65c66, #c9434e);
  }
  /* вузькі екрани: посилання окремою смужкою під шапкою */
  @media (max-width: 1260px) {
    .nav-center {
      position: fixed; top: 64px; left: 0; right: 0; transform: none;
      justify-content: center; gap: 4px; height: 42px;
      background: #15161d; border-bottom: 1px solid var(--border);
    }
    .nav-link { font-size: 12px; padding: 8px 14px; }
    .nav-link.active::after { left: 14px; right: 14px; bottom: 2px; }
    section { scroll-margin-top: 126px; }
    body { padding-top: 42px; }
  }
  @media (max-width: 600px) {
    .nav-center { top: 56px; height: 40px; }
    section { scroll-margin-top: 116px; }
    body { padding-top: 40px; }
  }
  .section-label {
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px; letter-spacing: 4px;
    color: var(--gold); text-transform: uppercase;
    margin-bottom: 12px;
  }
  .section-title {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(28px, 3.5vw, 68px);
    font-weight: 700; text-transform: uppercase; line-height: 1;
  }
  .section-title span { color: var(--gold); }
  .top-page {
    min-height: calc(100vh - 64px - 160px);
    max-width: var(--container); margin: 0 auto;
    padding: 120px 40px 96px;
  }
  .top-page .section-sub {
    margin-top: 18px; color: var(--text-muted);
    font-size: 15px; line-height: 1.7; font-weight: 300;
  }
  footer {
    background: var(--dark2);
    border-top: 1px solid var(--border);
    padding: 48px 40px 32px;
  }
  .footer-inner {
    max-width: var(--container);
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 40px;
    align-items: center;
  }
  .footer-left { justify-self: start; }
  .footer-center { justify-self: center; }
  .footer-right { justify-self: end; text-align: right; }
  .footer-logo {
    font-family: 'Oswald', sans-serif;
    font-size: 20px; font-weight: 700;
    letter-spacing: 3px; color: var(--gold);
    display: block;
    margin-bottom: 8px;
  }
  .footer-logo span { color: #fff; }
  .footer-tagline {
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px; color: var(--text-muted);
    letter-spacing: 2px; text-transform: uppercase;
  }
  .footer-copy {
    font-size: 12px; color: var(--text-muted);
    letter-spacing: 1px;
    margin-top: 8px;
    display: block;
  }
  .footer-socials-label {
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px; color: var(--text-muted);
    letter-spacing: 3px; text-transform: uppercase;
    text-align: center;
    margin-bottom: 14px;
  }
  .footer-socials {
    display: flex; gap: 14px; align-items: center;
    justify-content: center;
  }
  .footer-social {
    position: relative;
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.02);
    color: var(--text-muted);
    text-decoration: none;
    transition: all 0.25s cubic-bezier(.2,.7,.2,1);
  }
  .footer-social::before {
    content: attr(data-name);
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Rajdhani', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    white-space: nowrap;
    transition: color 0.25s;
  }
  .footer-social:hover {
    border-color: var(--gold);
    background: rgba(225,45,60,0.12);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(225,45,60,0.25);
  }
  .footer-social:hover::before {
    color: var(--gold);
  }
  /* индивидуальные цвета hover */
  .footer-social.tg:hover { color: #0088cc; border-color: #0088cc; background: rgba(0,136,204,0.12); box-shadow: 0 8px 24px rgba(0,136,204,0.25); }
  .footer-social.tg:hover::before { color: #0088cc; }
  .footer-social.tt:hover { color: #ff0050; border-color: #ff0050; background: rgba(255,0,80,0.12); box-shadow: 0 8px 24px rgba(255,0,80,0.25); }
  .footer-social.tt:hover::before { color: #ff0050; }
  .footer-social.dc:hover { color: #5865f2; border-color: #5865f2; background: rgba(88,101,242,0.12); box-shadow: 0 8px 24px rgba(88,101,242,0.25); }
  .footer-social.dc:hover::before { color: #5865f2; }
  .footer-social svg {
    width: 22px; height: 22px;
    fill: currentColor;
    transition: transform 0.25s;
  }
  .footer-social:hover svg {
    transform: scale(1.12);
  }
  @media (max-width: 900px) {
    nav { padding: 0 20px; }
    .top-page { padding: 96px 20px 72px; }
    footer { padding: 30px 20px; }
  }
  @media (max-width: 600px) {
    nav { padding: 0 14px; height: 56px; }
    .nav-logo { font-size: 14px; letter-spacing: 0; gap: 8px; }
    .nav-logo-img { height: 28px; max-width: 110px; }
    .nav-tg { padding: 7px 13px; font-size: 12px; }
    .nav-tg-icon { width: 16px; height: 16px; }
    .nav-tg span { display: none; }
    .nav-right { gap: 10px; }
    .lang-switcher { padding: 2px; gap: 1px; }
    .lang-btn { padding: 6px 7px; font-size: 10px; gap: 4px; letter-spacing: 0; }
    .lang-flag { width: 16px; height: 11px; border-radius: 2px; }
    .top-page { padding: 80px 14px 60px; }
    footer { padding: 32px 14px 24px; }
    .footer-inner { grid-template-columns: 1fr; gap: 28px; text-align: center; }
    .footer-left, .footer-center, .footer-right { justify-self: center; text-align: center; }
    .footer-social { width: 48px; height: 48px; }
    .footer-social svg { width: 20px; height: 20px; }
  }
</style>

<script>
const translations = {
  uk: { nav_tg: 'Замовити', nav_boost: 'Буст', nav_top: 'Топ танків', nav_streams: 'Стріми',
        top_label: 'Рейтинг', top_title: 'ТОП <span>ТАНКІВ</span>',
        top_soon: "Сторінка в розробці — скоро тут з'явиться топ танків.",
        footer_tagline: 'Професійний буст WoT', footer_follow: 'Слідкуйте за нами',
        footer_copy: '© ' + new Date().getFullYear() + ' WOT BOOSTED. Всі права захищені.' },
  en: { nav_tg: 'Order', nav_boost: 'Boost', nav_top: 'Top tanks', nav_streams: 'Streams',
        top_label: 'Rating', top_title: 'TOP <span>TANKS</span>',
        top_soon: 'This page is under construction — the top tanks list is coming soon.',
        footer_tagline: 'Professional WoT boosting', footer_follow: 'Follow us',
        footer_copy: '© ' + new Date().getFullYear() + ' WOT BOOSTED. All rights reserved.' }
};
let currentLang = 'uk';
function setLang(lang) {
  if (!translations[lang]) return;
  currentLang = lang;
  try { localStorage.setItem('wb_lang', lang); } catch (e) {}
  document.documentElement.lang = lang === 'en' ? 'en' : 'uk';
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.getAttribute('onclick') === "setLang('" + lang + "')"));
  const t = translations[lang];
  document.querySelectorAll('[data-t]').forEach(el => { const k = el.getAttribute('data-t'); if (t[k]) el.textContent = t[k]; });
  document.querySelectorAll('[data-t-html]').forEach(el => { const k = el.getAttribute('data-t-html'); if (t[k]) el.innerHTML = t[k]; });
}
let startLang = 'uk';
try { startLang = localStorage.getItem('wb_lang') || 'uk'; } catch (e) {}
setLang(startLang);
</script>
